x-app: &app
  build: .
  environment: &environment
    DATABASE_URL: postgresql://korsik_app:${DATABASE_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-korsik}
    REDIS_URL: redis://redis:6379/0
    LOCAL_WORKER_ENABLED: "false"
    OLLAMA_BASE_URL: http://host.docker.internal:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
    OLLAMA_THINK: ${OLLAMA_THINK:-}
    ROUTER_INTENT_MODEL: ${ROUTER_INTENT_MODEL:-}
    MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?Set MAX_BOT_TOKEN}
    MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:?Set MAX_WEBHOOK_SECRET}
    MAX_BOT_URL: ${MAX_BOT_URL:-https://max.ru/id5021013384_2_bot}
    MAX_API_BASE_URL: ${MAX_API_BASE_URL:-https://platform-api2.max.ru}
    MAX_CA_BUNDLE: certs/russian_trusted_root_ca.pem
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    RAG_URL: ${RAG_URL:-}
    HR_MAX_CHAT_ID: ${HR_MAX_CHAT_ID:-}
    HR_CONTACT_URL: ${HR_CONTACT_URL:-}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-korsik}
      POSTGRES_USER: ${POSTGRES_USER:-korsik_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  init:
    <<: *app
    environment:
      <<: *environment
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:-korsik_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-korsik}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD}
    command: ["python", "-m", "app.bootstrap"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command: ["celery", "-A", "app.tasks:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      api:
        condition: service_healthy
  beat:
    <<: *app
    command: ["celery", "-A", "app.tasks:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/korsik-beat"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
  redisdata:

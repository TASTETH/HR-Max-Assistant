name: Python and PostgreSQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MAX_BOT_TOKEN: test-not-a-real-bot-token
      MAX_WEBHOOK_SECRET: ci-webhook-secret
      LOCAL_WORKER_ENABLED: "false"
      DATABASE_ADMIN_URL: postgresql://postgres:ci-admin-password@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://korsik_app:ci-app-password@127.0.0.1:5432/postgres
      DATABASE_APP_PASSWORD: ci-app-password
      RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            onboarding/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check repository contents
        run: python scripts/check_git_content.py
      - name: Test
        run: python -m pytest -q
